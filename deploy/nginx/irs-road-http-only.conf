# Temporary vhost used ONLY to obtain the first Let's Encrypt certificate (webroot method).
# Replace road.example.ly, enable, reload, run certbot, then replace with irs-road.conf.
server {
    listen 80;
    listen [::]:80;
    server_name road.example.ly;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / { return 404; }
}
