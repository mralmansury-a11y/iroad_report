# /etc/nginx/sites-available/irs-road.conf
# Separate virtual host — does NOT modify nginx.conf or any other site.
# Replace road.example.ly with the real (sub)domain before enabling.
#   ln -s /etc/nginx/sites-available/irs-road.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream irs_road_app {
    server unix:/run/irs-road/gunicorn.sock fail_timeout=0;
    keepalive 16;
}

# HTTP → HTTPS (keeps the ACME challenge path for certbot --webroot)
server {
    listen 80;
    listen [::]:80;
    server_name road.example.ly;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name road.example.ly;

    # Certificates issued by certbot for THIS name only (does not touch existing certificates)
    ssl_certificate     /etc/letsencrypt/live/road.example.ly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/road.example.ly/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # created by certbot; remove if absent
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;      # created by certbot; remove if absent

    access_log /var/log/nginx/irs-road.access.log;
    error_log  /var/log/nginx/irs-road.error.log warn;

    # Upload limit (4 photos × 8 MB + form) — keep in line with MAX_CONTENT_LENGTH_MB
    client_max_body_size 25m;
    client_body_timeout 60s;

    # Security headers (the app also sends CSP / X-Frame-Options; HSTS is set here)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Static assets served directly by Nginx (cache-busted by the service-worker version)
    location /static/ {
        alias /opt/irs-road/app/app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker must never be cached long and must be served from the root scope
    location = /sw.js {
        proxy_pass http://irs_road_app;
        include /opt/irs-road/app/deploy/nginx/proxy_params_irs;
        add_header Cache-Control "no-cache" always;
    }

    # Uploaded photos are NEVER served directly: they live outside the web root and are
    # delivered only by the application after an authorisation check.
    location ^~ /uploads/ { return 404; }

    location / {
        proxy_pass http://irs_road_app;
        include /opt/irs-road/app/deploy/nginx/proxy_params_irs;
    }
}
